name: CI and image
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest -v
      - run: docker build -t container-log-api:ci .
      - name: Verify the real Docker and file sources over HTTP
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cleanup() {
            result=$?
            if (( result != 0 )); then
              docker inspect --format 'API state {{.State.Status}}, exit {{.State.ExitCode}}' log-api-ci || true
              docker logs log-api-ci || true
            fi
            docker rm -f log-api-ci log-fixture-ci >/dev/null 2>&1 || true; rm -rf "$dir"
            exit "$result"
          }
          trap cleanup EXIT
          chmod 0755 "$dir"
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          printf '%s\n' "$token" > "$dir/token"
          printf 'a\nb\nc\n' > "$dir/test.log"
          cat > "$dir/config.json" <<'EOF'
          {"token_file":"/config/token","sources":[{"id":"fixture","kind":"docker","container":"log-fixture-ci"},{"id":"file","kind":"file","path":"/config/test.log"}]}
          EOF
          chmod 0444 "$dir"/{config.json,token,test.log}
          docker run --name log-fixture-ci alpine:3.22 sh -c 'echo alpha; echo beta >&2; echo gamma'
          docker run -d --name log-api-ci --read-only --cap-drop ALL --security-opt no-new-privileges \
            --group-add "$(stat -c %g /var/run/docker.sock)" -p 127.0.0.1:18085:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$dir:/config:ro" container-log-api:ci
          base=http://127.0.0.1:18085/v1/sources
          auth=(-H "Authorization: Bearer $token")
          curl -fsS --retry 8 --retry-delay 1 --retry-all-errors --connect-timeout 2 --max-time 3 --retry-max-time 20 "${auth[@]}" "$base" | jq -e '.sources | length == 2'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$base")" = 401
          path_base="http://127.0.0.1:18085/t/$token/v1/sources"
          curl -fsS "$path_base" | jq -e '.sources | length == 2'
          curl -fsS "$path_base/file/lines?limit=1" | jq -e '.lines == ["a"]'
          containers=http://127.0.0.1:18085/v1/containers
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$containers")" = 401
          curl -fsS "${auth[@]}" "$containers" | jq -e '
            (.containers | any(.name == "log-api-ci" and .state == "running" and (.ports | contains("127.0.0.1:18085->8080/tcp"))))
            and (.containers | all(.name != "log-fixture-ci"))'
          curl -fsS "http://127.0.0.1:18085/t/$token/v1/containers?all=1" |
            jq -e '.containers | any(.name == "log-fixture-ci" and .state == "exited")'
          mcp="http://127.0.0.1:18085/t/$token/mcp"
          rpc() {
            curl -fsS -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              --data-binary "$1" "$mcp"
          }
          rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' |
            jq -e '.result.protocolVersion == "2025-11-25"'
          rpc '{"jsonrpc":"2.0","method":"notifications/initialized"}'
          rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' |
            jq -e '[.result.tools[] | select(.annotations.readOnlyHint) | .name] | sort == ["get_system_metrics","list_containers","list_log_sources","read_logs"]'
          rpc '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_containers","arguments":{"all":true}}}' |
            jq -e '.result.structuredContent.containers | any(.name == "log-fixture-ci" and .state == "exited")'
          rpc '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"get_system_metrics"}}' |
            jq -e '.result.structuredContent | .scope == "procfs_visible_to_container" and .memory.total_bytes > 0 and .swap.total_bytes >= 0'
          rpc '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"read_logs","arguments":{"source_id":"file","limit":1}}}' |
            jq -e '.result.structuredContent.lines == ["c"]'
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18085/t/01234567890123456789012345678901/v1/sources')" = 401
          curl -fsS "${auth[@]}" "$base/fixture/lines?limit=3" | jq -e '[.lines[] | split(" ")[1]] | sort == ["alpha","beta","gamma"]'
          curl -fsS "${auth[@]}" "$base/fixture/lines?mode=tail&limit=1" | jq -e '.lines | length == 1'
          curl -fsS "${auth[@]}" "$base/file/lines?offset=1&limit=2" | jq -e '.lines == ["b","c"]'
          curl -fsS "${auth[@]}" "$base/file/lines?mode=tail&limit=2" | jq -e '.lines == ["b","c"]'
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag container-log-api:ci "$image:sha-${GITHUB_SHA}"
          docker tag container-log-api:ci "$image:latest"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
